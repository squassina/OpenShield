<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('openshield-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>OpenShield — Inteligência em Segurança de Rede e Privacidade</title>
    <meta name="description" content="Plataforma autônoma e auto-hospedada de inteligência em segurança de rede e privacidade para residências e pequenos escritórios." />

    <meta property="og:description" content="Plataforma autônoma e auto-hospedada de inteligência em segurança de rede e privacidade para residências e pequenos escritórios." />
