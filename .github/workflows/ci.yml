name: OpenShield CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript & ESLint check
        run: npm run lint

      - name: Run Vitest suite
        run: npm test

      - name: Build production frontend bundle
        run: npm run build

      - name: Install Python FastAPI dependencies & run Node API tests
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r node-fastapi/requirements.txt httpx
          python3 -m py_compile node-fastapi/app.py
          python3 -m unittest discover -s node-fastapi/tests -v
